name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Debug current directory
        run: |
          echo "Current working directory: $(pwd)"
          echo "List files:"
          ls -al

      - name: Build and push image to Container Registry
        run: |
          echo "Starting Cloud Build for DeepFive..."
          gcloud builds submit . \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/deepfive || true
          echo "Cloud Build finished or skipped log stream check."

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying DeepFive to Cloud Run..."
          gcloud run deploy deepfive \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/deepfive \
            --region us-west1 \
            --platform managed \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=80
          echo "Deployment complete."