name: Build and Test

on:
  push:
    branches: [ main, game_dev ]
  pull_request:
    branches: [ main, game_dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfltk1.3-dev libgl1-mesa-dev xvfb

    - name: Build and Run Tests
      run: |
        # Run make test. It builds the test binary and runs it.
        # We use xvfb-run just in case FLTK needs a display, even though we might not be creating windows.
        xvfb-run make test
        
    - name: Verify Test Success
      run: |
        # Run the test binary again to ensure we capture the exit code (make test might mask it with || true)
        ./bin/test

