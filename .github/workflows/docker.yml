name: Docker Build & Xpra Smoke-Test

on:
  push:
    branches:
      - main
      - game_dev
    paths:
      - 'src/**'
      - 'bobcat_ui/**'
      - 'test/**'
      - 'Makefile'
      - 'dockerfile'
  pull_request:
    branches:
      - main
      - game_dev
    paths:
      - 'src/**'
      - 'bobcat_ui/**'
      - 'test/**'
      - 'Makefile'
      - 'dockerfile'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          IMAGE_TAG=deepfive:${{ github.sha }}
          docker build -t "${IMAGE_TAG}" .

      - name: Run container
        run: |
          docker run -d \
            --name deepfive-test \
            -p 8964:8964 \
            deepfive:${{ github.sha }}

      - name: Wait for Xpra port
        run: |
          echo "Waiting for Xpra to accept connections on :8964 ..."
          for i in {1..15}; do
            if (echo > /dev/tcp/127.0.0.1/8964) >/dev/null 2>&1; then
              echo "Xpra port is open."
              exit 0
            fi
            sleep 2
          done
          echo "Timed out: Xpra did not open port 8964."
          docker logs deepfive-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs deepfive-test || true

      - name: Stop container
        if: always()
        run: docker rm -f deepfive-test || true